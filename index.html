<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login | WebTech Practice</title>

  <style>
    /* ---- YOUR ORIGINAL CSS (UNCHANGED) ---- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s, color 0.3s;
    }

    body.dark {
      background: radial-gradient(circle at 30% 30%, #1e2a38, #0f172a);
      color: white;
    }

    body.light {
      background: radial-gradient(circle at 30% 30%, #e3e9f2, #ffffff);
      color: #111;
    }

    .login-container {
      background: rgba(255, 255, 255, 0.05);
      padding: 2rem;
      width: 400px;
      border-radius: 16px;
      backdrop-filter: blur(15px);
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
      transition: background 0.3s, color 0.3s;
    }

    body.light .login-container {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid #ddd;
      color: #111;
    }

    .login-container h2 {
      font-size: 1.8rem;
      text-align: center;
      margin-bottom: 0.5rem;
    }

    .login-container p {
      text-align: center;
      color: #ccc;
      margin-bottom: 2rem;
    }

    body.light .login-container p {
      color: #555;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      font-weight: 500;
      margin-bottom: 0.5rem;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #333;
      border-radius: 8px;
      background-color: rgba(255, 255, 255, 0.1);
      color: white;
      transition: background 0.3s, color 0.3s, border 0.3s;
    }

    body.light input[type="email"],
    body.light input[type="password"] {
      background-color: #fff;
      border: 1px solid #aaa;
      color: #111;
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      color: #ccc;
    }

    .note {
      font-size: 0.75rem;
      color: #999;
      margin-top: 0.25rem;
    }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 1rem 0;
    }

    .options input {
      margin-right: 0.5rem;
    }

    .options a {
      color: #4ea1f3;
      text-decoration: none;
      font-size: 0.85rem;
    }

    .btn {
      width: 100%;
      padding: 0.75rem;
      background: linear-gradient(90deg, #3b82f6, #2563eb);
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 3px 5px rgba(0, 0, 0, 0.2);
      transition: background 0.3s;
    }

    .btn:hover {
      background: linear-gradient(90deg, #2563eb, #1d4ed8);
    }

    .bottom-text {
      margin-top: 1rem;
      font-size: 0.9rem;
      text-align: left;
    }

    .bottom-text a {
      color: #4ea1f3;
      text-decoration: none;
    }

    .quick-demo {
      margin-top: 1rem;
      text-align: left;
    }

    .quick-demo button {
      background: #7c3aed;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .bottom-buttons {
      position: absolute;
      bottom: 20px;
      right: 20px;
      display: flex;
      gap: 10px;
    }

    .bottom-buttons button {
      padding: 0.4rem 0.8rem;
      border: none;
      border-radius: 10px;
      background: #1e293b;
      color: white;
      cursor: pointer;
      font-size: 0.8rem;
      transition: background 0.3s;
    }

    body.light .bottom-buttons button {
      background: #ddd;
      color: #111;
    }
  </style>
</head>

<body class="dark">

  <div class="login-container">
    <h2>Welcome back 👋</h2>
    <p>Sign in to continue to your dashboard</p>

    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="Enter your email address" />
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <div class="password-wrapper">
        <input type="password" id="password" placeholder="Enter your password" />
        <button type="button" class="toggle-password" onclick="togglePassword()">👁️</button>
      </div>
      <div class="note">Password must be at least 6 characters long.</div>
    </div>

    <div class="options">
      <label><input type="checkbox" id="rememberMe" /> Remember me for 30 days</label>
      <a href="#">Forgot password?</a>
    </div>

    <button class="btn" onclick="loginUser()">Sign In</button>

    <div class="bottom-text">
      New to WebTech Practice? <a href="create.html">Create an account</a>
    </div>

    <div class="quick-demo">
      <button onclick="quickFill()">⚡ Quick Demo</button>
    </div>
  </div>

  <div class="bottom-buttons">
    <button onclick="toggleTheme()">🎨 Theme</button>
    <button>💡 Tips</button>
  </div>

<script>

  // ------------------ 1) TOGGLE PASSWORD ------------------
  function togglePassword() {
    const passwordField = document.getElementById("password");
    const type = passwordField.type === "password" ? "text" : "password";
    passwordField.type = type;
  }

  // ------------------ 2) THEME SWITCH ------------------
  function toggleTheme() {
    const body = document.body;
    body.classList.toggle("dark");
    body.classList.toggle("light");
  }

  // ------------------ 3) QUICK DEMO BUTTON ------------------
  function quickFill() {
    document.getElementById("email").value = "demo@webtech.com";
    document.getElementById("password").value = "demo123";
  }

  // ------------------ 4) AUTO LOAD REMEMBERED LOGIN ------------------
  window.onload = function () {
    let savedEmail = localStorage.getItem("rememberEmail");
    let savedPassword = localStorage.getItem("rememberPassword");

    if (savedEmail && savedPassword) {
      document.getElementById("email").value = savedEmail;
      document.getElementById("password").value = savedPassword;
      document.getElementById("rememberMe").checked = true;
    }
  };

  // ------------------ 5) LOGIN SYSTEM USING LOCAL STORAGE ------------------
  function loginUser() {
    let email = document.getElementById("email").value.trim();
    let password = document.getElementById("password").value.trim();

    // get user data from signup page (created account)
    let storedUser = JSON.parse(localStorage.getItem("userAccount"));

    if (!email || !password) {
      alert("Please enter email and password.");
      return;
    }

    if (!storedUser) {
      alert("No account found. Please create a new account.");
      return;
    }

    if (email === storedUser.email && password === storedUser.password) {

      // REMEMBER ME feature
      if (document.getElementById("rememberMe").checked) {
        localStorage.setItem("rememberEmail", email);
        localStorage.setItem("rememberPassword", password);
      } else {
        localStorage.removeItem("rememberEmail");
        localStorage.removeItem("rememberPassword");
      }

      alert("Login successful!");
      window.location.href = "userDemo.html"; 
    } 
    else {
      alert("Incorrect email or password.");
    }
  }

</script>

</body>
</html>
